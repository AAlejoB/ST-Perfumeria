<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121214">
  <title>Sin conexión — ST Perfumería</title>
  <link rel="icon" type="image/svg+xml" href="img/icon-st.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #0a0a0c 0%, #121214 60%, #1a1a1c 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeIn .6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 18px;
      background: #121214;
      border: 2px solid #E8B800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 2.2rem;
      color: #E8B800;
      box-shadow: 0 8px 30px rgba(232, 184, 0, 0.2);
    }
    .icon-wifi {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: .7;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: .6rem;
      color: #E8B800;
    }
    p {
      font-size: .95rem;
      color: #bbb;
      line-height: 1.5;
      margin-bottom: 1.8rem;
    }
    .btn {
      display: inline-block;
      padding: .9rem 1.8rem;
      background: #E8B800;
      color: #121214;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
      margin: .3rem;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232, 184, 0, 0.3); }
    .btn-secondary {
      background: transparent;
      color: #fff;
      border: 1px solid #333;
    }
    .btn-secondary:hover { border-color: #E8B800; color: #E8B800; }
    .status {
      margin-top: 1.5rem;
      font-size: .75rem;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      animation: pulse 1.5s infinite;
    }
    .dot.online { background: #25d366; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ST</div>
    <div class="icon-wifi">📡</div>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar la página. Revisá tu conexión a internet y volvé a intentar.</p>
    <button class="btn" onclick="location.reload()">↻ Reintentar</button>
    <a href="/" class="btn btn-secondary">Ir al inicio</a>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Sin conexión</span>
    </div>
  </div>
  <script>
    function updateStatus() {
      var dot = document.getElementById('statusDot');
      var txt = document.getElementById('statusText');
      if (navigator.onLine) {
        dot.classList.add('online');
        txt.textContent = 'Conexión restablecida — recargá la página';
      } else {
        dot.classList.remove('online');
        txt.textContent = 'Sin conexión';
      }
    }
    window.addEventListener('online', function() {
      updateStatus();
      setTimeout(function() { location.reload(); }, 800);
    });
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
